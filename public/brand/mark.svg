<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Action threshold mark">
  <title>Action threshold</title>
  <!--
    THE MARK: the action threshold.

    In integrated pest management, the action threshold is the pest density at which
    intervention becomes warranted. It is the single concept that separates a professional
    from someone who sprays on a schedule — and it is the concept the brand is named for.

    The glyph is that graph, reduced: a dashed horizontal line (the threshold), a solid
    population curve crossing it, and a filled node at the crossing point. It reads as a
    real idea to an insider and as a clean geometric mark to everyone else.

    Built to survive 16px. No gradients, no fine detail, no text.
  -->
  <rect width="64" height="64" fill="#16171a"/>
  <!-- threshold -->
  <path d="M8 34 H56" stroke="#e0a013" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="square"/>
  <!-- population curve crossing it -->
  <path d="M10 52 C22 52 26 42 34 30 C40 21 48 15 54 12"
        fill="none" stroke="#f0efe9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossing node -->
  <circle cx="31.5" cy="34" r="6" fill="#16171a"/>
  <circle cx="31.5" cy="34" r="4" fill="#e0a013"/>
</svg>
