<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon variant. The dashed threshold reads at display size and disappears below ~32px,
    so the small mark uses a SOLID threshold line and heavier strokes. Same idea, fewer parts.
    Do not use the dashed mark as a favicon.
  -->
  <rect width="64" height="64" rx="6" fill="#16171a"/>
  <path d="M6 34 H58" stroke="#e0a013" stroke-width="5" stroke-linecap="square"/>
  <path d="M11 53 C24 53 28 42 36 28 C42 19 50 13 56 10"
        fill="none" stroke="#f0efe9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="34" r="8" fill="#16171a"/>
  <circle cx="32" cy="34" r="5" fill="#e0a013"/>
</svg>
